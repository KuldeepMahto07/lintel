# Lintel on your own server: `docker compose up -d`, then open http://<host>:8002/signup.
# Copy .env.example to .env first and fill it in (docs/self-hosting.md).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lintel
      POSTGRES_USER: lintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - lintel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lintel"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lintel:${POSTGRES_PASSWORD}@db:5432/lintel
    ports:
      - "8002:8002"

volumes:
  lintel-db:
