<!-- title: Join the pilot · Lintel | description: Join the Lintel pilot and try it on one of your own drawings. | nav: contact -->
<section class="page-hero">
  <div class="wrap">
    <div class="label reveal">Join the pilot</div>
    <h1 class="reveal" data-d=".1">Try Lintel on <em>your</em> drawings.</h1>
    <p class="reveal" data-d=".2">Tell us a little about your practice. We'll set you up with the plugin and help you turn your office standards into rules.</p>
    <form class="form reveal" data-d=".3" id="pilot">
      <label>Name<input name="name" autocomplete="name" required></label>
      <label>Work email<input name="email" type="email" autocomplete="email" required></label>
      <label>Practice<input name="firm" autocomplete="organization"></label>
      <label>People in the practice<select name="firm_size"><option>1–5</option><option>6–20</option><option>21–100</option><option>100+</option></select></label>
      <label class="full">Which tool do you design in?<select name="host"><option>Rhino</option><option>SketchUp</option><option>Revit</option><option>Archicad</option><option>Other</option></select></label>
      <label class="full">What do you check most often? (optional)<textarea name="message" rows="4" placeholder="e.g. door widths in multifamily units, stair geometry, room areas"></textarea></label>
      <div><button class="btn btn-go">Send <span class="arrow">→</span></button></div>
      <p class="form-msg" role="status"></p>
    </form>
  </div>
</section>
